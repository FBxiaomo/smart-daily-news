[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-daily-news"
version = "0.2.0"
description = "Source-linked daily briefings with durable email and webhook delivery"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4,<3", "feedparser>=6.0.11,<7", "tzdata>=2025.2"]

[project.scripts]
smart-daily-news = "daily_news.cli:main"

[tool.setuptools]
packages = ["daily_news"]

[tool.setuptools.package-data]
daily_news = ["*.toml", "*.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
